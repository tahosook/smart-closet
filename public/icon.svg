<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>
  </defs>
  <!-- Background with rounded corners -->
  <rect width="512" height="512" rx="112" fill="url(#bg)" />
  <!-- Subtle border -->
  <rect x="8" y="8" width="496" height="496" rx="104" fill="none" stroke="#334155" stroke-width="8" opacity="0.6" />
  
  <!-- Hanger hook -->
  <path d="M256 128 C280 128 296 144 286 168 C276 190 256 198 256 224" fill="none" stroke="url(#accent)" stroke-width="20" stroke-linecap="round" />
  <circle cx="256" cy="120" r="12" fill="url(#accent)" />

  <!-- Hanger triangle / shoulders -->
  <path d="M120 280 L256 224 L392 280" fill="none" stroke="url(#accent)" stroke-width="20" stroke-linecap="round" stroke-linejoin="round" />
  <line x1="140" y1="280" x2="372" y2="280" stroke="#64748b" stroke-width="12" stroke-linecap="round" />

  <!-- Shirt collar -->
  <path d="M220 238 L256 270 L292 238" fill="none" stroke="#ffffff" stroke-width="14" stroke-linecap="round" stroke-linejoin="round" />
  <!-- Shirt front line & buttons -->
  <line x1="256" y1="270" x2="256" y2="400" stroke="#ffffff" stroke-width="12" stroke-linecap="round" stroke-dasharray="1 30" />
  <circle cx="256" cy="310" r="8" fill="#38bdf8" />
  <circle cx="256" cy="355" r="8" fill="#38bdf8" />

  <!-- Sparkle badge for 1-second decision -->
  <path d="M375 145 Q395 155 405 175 Q415 155 435 145 Q415 135 405 115 Q395 135 375 145 Z" fill="#38bdf8" />
</svg>
